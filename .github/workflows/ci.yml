name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      db-changed: ${{ steps.changes.outputs.db }}
      gateway-changed: ${{ steps.changes.outputs.gateway }}
      infra-changed: ${{ steps.changes.outputs.infra }}
      extensions-changed: ${{ steps.changes.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            db:
              - 'db/migrations/**'
              - 'db/src/**'
              - 'db/api_v1/**'
              - 'db/init/**'
              - 'db/tests/**'
            gateway:
              - 'gateway/**'
            infra:
              - 'infra/**'
            extensions:
              - 'infra/**'
              - 'db/init/**'
              - 'wiki/01-项目简介/extensions/**'
              - 'scripts/check-extensions.sh'

  db-lint:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.db-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQL Lint
        run: |
          pip install sqlfluff
          sqlfluff lint db/migrations/ --dialect postgres || true
          sqlfluff lint db/src/ --dialect postgres || true

  db-migrate-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.db-changed == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64 -o dbmate
          chmod +x dbmate
          sudo mv dbmate /usr/local/bin/
      - name: dbmate dry-run
        env:
          DBMATE_DATABASE_URL: "postgres://postgres:test@localhost:5432/test_db?sslmode=disable"
        run: |
          cd db
          dbmate up --dry-run

  gateway-check:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gateway-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose validate
        run: cd gateway && docker compose config --quiet
      - name: Docker build
        run: cd gateway && docker compose build

  infra-check:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.infra-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML lint
        run: |
          pip install yamllint
          yamllint infra/pigsty.yml infra/pigsty.yml.tpl

      - name: Render template sync check (development)
        run: |
          bash scripts/render-config.sh development /tmp/omnipg-render
          diff -u infra/pigsty.yml /tmp/omnipg-render/pigsty.yml
          diff -u infra/userlist.txt /tmp/omnipg-render/userlist.txt

  extensions-check:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.extensions-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Extensions consistency check
        run: bash scripts/check-extensions.sh