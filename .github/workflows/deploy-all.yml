name: Deploy All (One-Click)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: '跳过 E2E 测试'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy All Components
        env:
          SERVER_HOST: ${{ secrets.DB_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
            set -euo pipefail
            
            # 拉取最新代码
            cd ~/OmniPG
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # 使用一键部署脚本
            bash scripts/deploy-all.sh ${{ inputs.environment }}
          EOF
      
      - name: Run E2E Tests
        if: ${{ inputs.skip_tests != true }}
        env:
          SERVER_HOST: ${{ secrets.DB_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
            set -euo pipefail
            cd ~/OmniPG
            
            # 运行端到端测试
            bash scripts/e2e-test.sh
          EOF
