name: Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: '跳过 E2E 测试'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy Gateway Services
        env:
          SERVER_HOST: ${{ secrets.GATEWAY_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APISIX_ADMIN_KEY: ${{ secrets.APISIX_ADMIN_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTHENTICATOR_PASSWORD: ${{ secrets.AUTHENTICATOR_PASSWORD }}
          LOGTO_DB_PASSWORD: ${{ secrets.LOGTO_DB_PASSWORD }}
          JWKS_JSON: ${{ secrets.JWKS_JSON }}
          LOGTO_WEBHOOK_SIGNING_KEY: ${{ secrets.LOGTO_WEBHOOK_SIGNING_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "export DB_PASSWORD='${DB_PASSWORD}' AUTHENTICATOR_PASSWORD='${AUTHENTICATOR_PASSWORD}' LOGTO_DB_PASSWORD='${LOGTO_DB_PASSWORD}' APISIX_ADMIN_KEY='${APISIX_ADMIN_KEY}' JWKS_JSON='${JWKS_JSON}' LOGTO_WEBHOOK_SIGNING_KEY='${LOGTO_WEBHOOK_SIGNING_KEY}'; set -euo pipefail; cd ~/OmniPG; git fetch origin; git checkout ${{ github.ref_name }}; git pull origin ${{ github.ref_name }}; bash scripts/deploy-gateway.sh ${{ inputs.environment }}"
      
      - name: Initialize APISIX Routes
        if: ${{ inputs.skip_tests != true }}
        env:
          SERVER_HOST: ${{ secrets.GATEWAY_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APISIX_ADMIN_KEY: ${{ secrets.APISIX_ADMIN_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
            set -euo pipefail
            cd ~/OmniPG
            
            # 加载环境变量
            [ -f gateway/.env ] && export $(grep -v '^#' gateway/.env | xargs)
            
            # 初始化 APISIX 路由和插件
            bash scripts/init-apisix-routes.sh
          EOF
      
      - name: Run E2E Tests
        if: ${{ inputs.skip_tests != true }}
        env:
          SERVER_HOST: ${{ secrets.GATEWAY_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
            set -euo pipefail
            cd ~/OmniPG
            
            # 运行 E2E 测试
            bash scripts/e2e-test.sh
          EOF
