name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      mode:
        description: '部署模式'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - db
          - gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy Infrastructure
        env:
          SERVER_HOST: ${{ inputs.mode == 'gateway' && secrets.GATEWAY_SERVER_HOST || secrets.DB_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTHENTICATOR_PASSWORD: ${{ secrets.AUTHENTICATOR_PASSWORD }}
          LOGTO_DB_PASSWORD: ${{ secrets.LOGTO_DB_PASSWORD }}
          APISIX_ADMIN_KEY: ${{ secrets.APISIX_ADMIN_KEY }}
          JWKS_JSON: ${{ secrets.JWKS_JSON }}
          LOGTO_WEBHOOK_SIGNING_KEY: ${{ secrets.LOGTO_WEBHOOK_SIGNING_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "export DB_PASSWORD='${DB_PASSWORD}' AUTHENTICATOR_PASSWORD='${AUTHENTICATOR_PASSWORD}' LOGTO_DB_PASSWORD='${LOGTO_DB_PASSWORD}' APISIX_ADMIN_KEY='${APISIX_ADMIN_KEY}' JWKS_JSON='${JWKS_JSON}' LOGTO_WEBHOOK_SIGNING_KEY='${LOGTO_WEBHOOK_SIGNING_KEY}'; set -euo pipefail; cd ~/OmniPG; git fetch origin; git checkout ${{ github.ref_name }}; git pull origin ${{ github.ref_name }}; LIMIT=$SERVER_HOST bash scripts/deploy-infra.sh ${{ inputs.mode }} ${{ inputs.environment }}"
