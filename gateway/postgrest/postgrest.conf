# ==============================================================================
# PostgREST 参考配置文件（2026-08-19 已与 compose 运行态对齐）
# ⚠️ 本文件不挂载进容器——运行态以 gateway/docker-compose.yml 的
#    PGRST_* 环境变量为权威；此处仅为本地二进制调试参考。
# 变更记录:
#   - 2026-08-19: 移除 api_v1_sales / api_v1_inventory（063 已退役）、
#     db-pre-request（check_token_blacklist 已退役）、jwt-role-claim-key 改 .pg_role，
#     与 compose 运行态一致（单 schema api_v1_public；40 号方案 extra search path = api_v1_public, platform, ext）
# ==============================================================================

# ------------------------------------------------------------------------------
# 数据库连接 URI（通过 Pgbouncer 连接）
# ------------------------------------------------------------------------------
db-uri = "postgres://authenticator:***@host.docker.internal:6432/app_db?sslmode=disable"

# ------------------------------------------------------------------------------
# 暴露的 Schema（PostgREST 自动映射为 API 路径和 Swagger Tag）
#   运行态单 schema：api_v1_public（系统管理域；sales/inventory 已于 2026-08-15 退役）
# ------------------------------------------------------------------------------
db-schemas = "api_v1_public"

# ------------------------------------------------------------------------------
# 额外的搜索路径（与 compose PGRST_DB_EXTRA_SEARCH_PATH 一致）
# ------------------------------------------------------------------------------
db-extra-search-path = "api_v1_public, platform, ext"

# ------------------------------------------------------------------------------
# 匿名角色（未认证用户切换到此角色）
# ------------------------------------------------------------------------------
db-anon-role = "web_anon"

# ------------------------------------------------------------------------------
# JWT 验证密钥（由 gateway/.env 的 JWKS_JSON 注入）
# ------------------------------------------------------------------------------
jwt-secret = "$(JWKS_JSON)"

# ------------------------------------------------------------------------------
# JWT 角色 Claim 键名（与 compose PGRST_JWT_ROLE_CLAIM_KEY 一致）
#   使用 JSPath .pg_role：DB 角色取自 Logto JWT 的 pg_role claim
# ------------------------------------------------------------------------------
jwt-role-claim-key = ".pg_role"

# ------------------------------------------------------------------------------
# 服务端配置
# ------------------------------------------------------------------------------
server-host = "0.0.0.0"
server-port = 3000

# ------------------------------------------------------------------------------
# OpenAPI 代理 URI（用于 Swagger UI）
# ------------------------------------------------------------------------------
openapi-server-proxy-uri = "http://localhost:3000"

# ------------------------------------------------------------------------------
# 聚合函数允许（支持 count、sum 等）
# ------------------------------------------------------------------------------
db-aggregates-enabled = true

# ------------------------------------------------------------------------------
# 最大返回行数
# ------------------------------------------------------------------------------
max-rows = 1000

# ------------------------------------------------------------------------------
# 错误级别
# ------------------------------------------------------------------------------
pre-error-extended = true

# ------------------------------------------------------------------------------
# 事务结束方式
# ------------------------------------------------------------------------------
db-tx-end = "commit"

# ------------------------------------------------------------------------------
# 日志级别
# ------------------------------------------------------------------------------
log-level = warn

# ------------------------------------------------------------------------------
# CORS 配置（由 APISIX 网关处理）
# ------------------------------------------------------------------------------
cors-origins = ""
