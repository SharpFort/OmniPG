routes:
  - uri: /well-known/jwks
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      proxy-rewrite:
        uri: /.well-known/jwks.json
    priority: 100

  - uri: /rpc/user_login_sso
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      request-validation:
        body_schema:
          type: object
          required: [username, password]
          properties:
            username:
              type: string
              minLength: 3
            password:
              type: string
              minLength: 6
    priority: 90

  - uri: /rpc/refresh_token_rtr
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      request-validation:
        body_schema:
          type: object
          required: [old_refresh_token]
          properties:
            old_refresh_token:
              type: string
              minLength: 64
    priority: 90

  - uri: /api/v1/sys/*
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/v1/sys/(.*)", "/api_v1_sys/$1"]
      jwt-auth: {}
    priority: 50

  - uri: /rpc/*
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      jwt-auth: {}
    priority: 40

  - uri: /*
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      jwt-auth: {}
    priority: 10

  - uri: /api/v1/sales/*
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/v1/sales/(.*)", "/api_v1_sales/$1"]
      jwt-auth: {}
    priority: 20

  - uri: /api/v1/inventory/*
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/v1/inventory/(.*)", "/api_v1_inventory/$1"]
      jwt-auth: {}
    priority: 20

  - uri: /healthz
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
    priority: 200

upstreams:
  - id: postgrest
    type: roundrobin
    nodes:
      "postgrest:3000": 1

global_rules:
  - id: 1
    plugins:
      cors:
        allow_origins: "http://localhost:5173,http://localhost:3000,http://192.168.0.128:3000"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Requested-With"
        expose_headers: "X-Total-Count,Content-Range"
        max_age: 3600
        allow_credentials: true
  
  - id: 2
    plugins:
      limit-req:
        rate: 100
        burst: 50
        rejected_code: 429
        key: "consumer_name || ':' || remote_addr"
        policy: redis
        redis_host: host.docker.internal
        redis_port: 6379
        redis_timeout: 1000

consumers: []
plugin_configs: []
#END