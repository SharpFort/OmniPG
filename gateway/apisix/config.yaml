# =============================================================================
# APISIX 网关配置 — Traditional 模式（网关 + Admin API + 内置 Dashboard）
# 变更记录:
#   2026-08-03  从 standalone(data_plane+yaml) 切换为 traditional(etcd+Admin API)
#               新增: 内置 Dashboard UI / Status API(7085) / Control API(9092)
#   2026-08-20 端口收敛: Control API 改绑 127.0.0.1；allow_admin 收窄为私网段（仅内网管理）
#   配套文档: docs/审查文档/21-APISIX全栈部署可行性分析-网关AdminAPI与Dashboard.md
#              wiki/08-运维/APISIX端口收敛.md
#   路由管理: 不再读取 apisix.yaml，由 Admin API 管理（scripts/init-apisix-routes.sh 初始化，2026-08-19 起）
# =============================================================================
apisix:
  node_listen: 9080   # 数据面 HTTP —— 唯一对外端口
  # 数据面 HTTPS 沿用镜像默认监听 9443，但 compose 不再映射宿主端口（预留）；
  # 需要 HTTPS 时由外层 LB/反代终结 TLS，或在本文件配置 ssl 证书后恢复 9443 映射
  enable_ipv6: false

  # Control API（内部运维接口）：仅本容器回环可达，勿暴露公网
  enable_control: true
  control:
    ip: "127.0.0.1"
    port: 9092

  # Status API（健康/就绪探针，供部署脚本与 e2e 使用）
  # 容器内保持 0.0.0.0 供 Docker healthcheck/脚本使用；宿主映射已限 127.0.0.1:7085
  status:
    ip: "0.0.0.0"
    port: 7085

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    admin_key_required: true
    enable_admin_cors: true          # Admin API CORS（内置 Dashboard 跨域需要）
    # 内嵌 Dashboard UI（http://localhost:9180/ui）。⚠️ Dashboard 无独立认证、
    # 与 Admin API 同 key 全权——9180 已回环绑定（compose 127.0.0.1:9180），
    # 生产部署应置 false 或经独立认证的反代暴露（citywalk 扫描 P1-1 修法 3）
    enable_admin_ui: true
    # 2026-11-22 收紧（P1-1 修法 4）：仅回环 + compose 内网桥段（172.20.0.0/16，
    # 含 docker-proxy 网关 172.20.0.1）。移除 10/8、192.168/16——9180 已回环绑定，
    # LAN 管理不应放行；确需远程管理走 SSH 隧道/VPN 再按需加网段
    allow_admin:
      - 127.0.0.0/8
      - 172.16.0.0/12
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}   # 由 docker-compose 注入（gateway/.env → 容器环境变量）
        role: admin                  # ⚠️ 部署到任何非本地环境前，务必更换默认 Key！

  etcd:
    host:
      - "http://app-etcd:2379"       # compose 内 etcd 容器（不映射宿主端口，避免与 Pigsty etcd 冲突）
    prefix: /apisix
    timeout: 30
    # 2026-11-22 鉴权收口（citywalk 扫描 P2-1）：etcd 已启用 root 密码
    # （compose ETCD_ROOT_PASSWORD），APISIX 连接串同步带凭据；网关容器注入同名
    # 环境变量，config.yaml 经 ${{...}} 模板取值
    user: root
    password: ${{ETCD_ROOT_PASSWORD}}