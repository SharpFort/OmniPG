# =============================================================================
# APISIX 网关配置 — Traditional 模式（网关 + Admin API + 内置 Dashboard）
# 变更记录:
#   2026-08-03  从 standalone(data_plane+yaml) 切换为 traditional(etcd+Admin API)
#               新增: 内置 Dashboard UI / Status API(7085) / Control API(9092)
#   配套文档: docs/审查文档/21-APISIX全栈部署可行性分析-网关AdminAPI与Dashboard.md
#   路由管理: 不再读取 apisix.yaml，由 Admin API 管理（scripts/setup_apisix.sh 初始化）
# =============================================================================
apisix:
  node_listen: 9080
  enable_ipv6: false

  # Control API（内部运维接口，勿暴露公网）
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

  # Status API（健康/就绪探针，供部署脚本与 e2e 使用）
  status:
    ip: "0.0.0.0"
    port: 7085

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    admin_key_required: true
    enable_admin_cors: true          # Admin API CORS（内置 Dashboard 跨域需要）
    enable_admin_ui: true            # 内嵌 Dashboard UI（http://<apisix>:9180/ui）
    allow_admin:                     # ⚠️ 开发环境放行所有来源；生产务必收窄为内网/Docker 网段！
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}   # 由 docker-compose 注入（gateway/.env → 容器环境变量）
        role: admin                  # ⚠️ 部署到任何非本地环境前，务必更换默认 Key！

  etcd:
    host:
      - "http://app-etcd:2379"       # compose 内 etcd 容器（不映射宿主端口，避免与 Pigsty etcd 冲突）
    prefix: /apisix
    timeout: 30
