# =============================================================================
# OmniPG - Docker Compose Stack（全栈版: 网关 + Admin API + 内置 Dashboard）
# 架构: PostgreSQL/pgBouncer/Redis 由 Pigsty 统一管理（宿主 WSL2），
#       Compose 仅部署网关侧服务（etcd/APISIX/PostgREST/Swagger/Logto；Casdoor/Syncer 已于 2026-08-19 退役）
# 变更记录:
#   2026-08-03 ① 新增 etcd 容器，APISIX 切回 traditional 模式（Admin API/Dashboard 可用）
#              ② APISIX 新增端口: 9180(Admin API + Dashboard UI) / 7085(Status API)
#              ③ 全部凭据参数化（gateway/.env），不再硬编码
#              ④ 卷路径相对化；Swagger API_URL 参数化；Syncer Admin URL 修正为 9180
#              ⑤ 【移除 docker PG】删除 pgsql/pgbouncer/casdoor-db 容器，
#                 连接串改指宿主 Pigsty PG（host.docker.internal:6432/5432）
#                 详见 docs/审查文档/22-*
#              ⑥ 2026-08-20 端口收敛：对外仅 9080；9180 仅内网管理（allow_admin 收窄私网段）；
#                 7085 仅绑本机回环 127.0.0.1；9443（数据面 HTTPS）不再映射宿主（预留）
#   配套文档: docs/审查文档/20-*、21-*、22-*
# =============================================================================

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  etcd_data:
    driver: local

services:
  # ===========================================================================
  # etcd — APISIX 配置中心（traditional 模式必需）
  # 注意: 不映射 2379 到宿主机（Pigsty etcd 已占用 2379），容器间用 app-etcd:2379
  # ===========================================================================
  etcd:
    image: bitnamilegacy/etcd:3.5.11
    container_name: app-etcd
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.8
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"    # ⚠️ 仅开发环境；生产改用 ETCD_ROOT_PASSWORD
      ETCD_ADVERTISE_CLIENT_URLS: "http://app-etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    volumes:
      - etcd_data:/bitnami/etcd

  # ===========================================================================
  # APISIX API 网关（Traditional 模式: 网关 + Admin API + 内置 Dashboard）
  # ===========================================================================
  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: app-apisix
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.3
    environment:
      APISIX_WORKER_PROCESSES: "1"
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}   # ⚠️ 上线前务必更换
    ports:
      - "9080:9080"               # 数据面 HTTP —— 唯一对外端口
      - "9180:9180"               # Admin API + 内置 Dashboard（仅内网管理；浏览器 http://localhost:9180/ui）
      - "127.0.0.1:7085:7085"     # Status API（仅本机回环：供健康检查脚本，不暴露局域网）
      # 9443（数据面 HTTPS）不再映射宿主：预留；需要 HTTPS 时由外层 LB/反代终结 TLS 后转发 9080，
      # 或在 config.yaml 配置 ssl 证书后恢复映射
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd

  # ===========================================================================
  # PostgREST API 引擎（数据源: 宿主 Pigsty pgBouncer，经 host.docker.internal:6432）
  #   ⚠️ 依赖宿主 pgBouncer 已重载 /etc/pgbouncer/userlist.txt；若仍报
  #      "SASL authentication failed"，需在 WSL 宿主侧重载/重启 pgbouncer：
  #        pkill pgbouncer && sudo -u postgres /usr/sbin/pgbouncer /etc/pgbouncer/pgbouncer.ini &
  # ===========================================================================
  postgrest:
    image: postgrest/postgrest:v14.15
    container_name: app-postgrest
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.2
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator_dev_pass}@host.docker.internal:6432/app_db?sslmode=disable"
      # 多模块暴露（2026-09-05 全量接入）：首个 schema 为默认 profile（Accept-Profile 切换，
      # URL 路径无 schema 前缀）；与 gateway/swagger/swagger-initializer.js 的 MODULES 保持一致
      PGRST_DB_SCHEMAS: "api_v1_platform, api_v1_masterdata, api_v1_commons, api_v1_content, api_v1_content_comment, api_v1_content_feedback, api_v1_content_notes, api_v1_content_places, api_v1_content_reaction, api_v1_content_translations, api_v1_creator, api_v1_business, api_v1_payout, api_v1_rewards, api_v1_files, api_v1_identity, api_v1_social, api_v1_chat, api_v1_map, api_v1_search, api_v1_notification, api_v1_moderation, api_v1_fraud"
      PGRST_DB_ANON_ROLE: web_anon
      # extra-search-path 必须含各模块业务 schema（视图/函数跨 schema 解析依赖）+ ext（postgis/pgcrypto）
      PGRST_DB_EXTRA_SEARCH_PATH: "api_v1_platform, api_v1_masterdata, api_v1_commons, api_v1_content, api_v1_content_comment, api_v1_content_feedback, api_v1_content_notes, api_v1_content_places, api_v1_content_reaction, api_v1_content_translations, api_v1_creator, api_v1_business, api_v1_payout, api_v1_rewards, api_v1_files, api_v1_identity, api_v1_social, api_v1_chat, api_v1_map, api_v1_search, api_v1_notification, api_v1_moderation, api_v1_fraud, platform, commons, content, content_comment, content_feedback, content_notes, content_places, content_reaction, content_translations, creator, business, payout, rewards, files, identity, social, chat, map, search, notification, moderation, fraud, masterdata, ext"
      # OpenAPI 文档忽略权限过滤：spec 完整呈现模块全部视图/RPC（数据访问仍受真实 GRANT 管控）；
      # 默认 follow-privileges 下匿名角色几乎无授权，Swagger 只能看到 PUBLIC 默认 EXECUTE 的 RPC
      PGRST_OPENAPI_MODE: "ignore-privileges"
      # Logto JWKS（ES384 公钥 JSON）作为 JWT 验签密钥；容器内同时暴露 JWKS_JSON 供 conf 引用
      JWKS_JSON: '${JWKS_JSON}'
      PGRST_JWT_SECRET: '${JWKS_JSON}'
      # Logto customizer 注入 pg_role claim（. 开头 = JSPath 语法）
      PGRST_JWT_ROLE_CLAIM_KEY: ".pg_role"
      PGRST_DB_PRE_REQUEST: ""
      # Swagger try-it-out 直连 PostgREST（3100）：APISIX 仅有 /rpc/* 与 /api/v1/platform/* 路由，
      # 无 /v_* 通配路由，指向 9080 时视图端点 try-it-out 会 404；前端业务入口仍走 9080 网关
      PGRST_OPENAPI_SERVER_PROXY_URI: "http://localhost:3100"   # spec 的 servers 字段 = try-it-out 目标
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_CORS_ORIGINS: "*"           # Swagger 浏览器端直连拉取 spec，必须开启
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_MAX_ROWS: "1000"
      PGRST_PRE_ERROR_EXTENDED: "true"
      PGRST_DB_TX_END: "commit"
    ports:
      - "3100:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================================================
  # Swagger UI
  #   多模块切换：挂载自定义 swagger-initializer.js（urls 下拉 + Accept-Profile 注入）。
  #   注意：必须移除 API_URL env——镜像 entrypoint 的 configurator 检测到 URL/URLS/CONFIG_URL
  #   类 env 会重写容器内 swagger-initializer.js，覆盖挂载的自定义文件。
  # ===========================================================================
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.2.0
    container_name: app-swagger
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.4
    volumes:
      - ./swagger/swagger-initializer.js:/usr/share/nginx/html/swagger-initializer.js:ro
    ports:
      - "8082:8080"

  # ===========================================================================
  # Logto IAM/OAuth 服务 — 自部署 OSS v1.42（替代 Casdoor，05 方案 §4）
  #   DB: 宿主 PG app_db 的 public schema（host.docker.internal:5433，直连不经 pgbouncer）
  #   端口: 主机 3001(core)/3002(console)，容器内对等（官方默认）
  #   PostgREST 主机端口已平移至 3100
  # ===========================================================================
  logto:
    image: ghcr.io/logto-io/logto:latest
    container_name: app-logto
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.9
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && node /tmp/logto-csp-patch.js && npm start"]
    volumes:
      - "./logto-csp-patch.js:/tmp/logto-csp-patch.js:ro"
    ports:
      - "3001:3001"   # Core API / OIDC / Management API
      - "3002:3002"   # Admin Console
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: "postgres://logto:${LOGTO_DB_PASSWORD:-logto_dev_pass_2026}@host.docker.internal:5433/app_db?sslmode=disable"
      DATABASE_STATEMENT_TIMEOUT: "DISABLE_TIMEOUT"   # pgBouncer 兼容（v1.36.0+）
      ENDPOINT: "http://localhost:3001"
      ADMIN_ENDPOINT: "http://localhost:3002"
      # CSP frame-ancestors 注入（logto-csp-patch.js 启动时打补丁；OmniAdmin 固定 3006/3007 嵌入登录页用）
      # ⚠️ 与 .env VITE_PORT 保持一致；改端口后须 --force-recreate 重建容器（幂等补丁不会自动改）
      LOGTO_EXTRA_FRAME_ANCESTOR: "http://localhost:3006 http://localhost:3007 http://172.28.32.1:3006 http://172.28.32.1:3007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
