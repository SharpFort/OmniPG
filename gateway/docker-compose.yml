# =============================================================================
# OmniPG - Docker Compose Stack（全栈版: 网关 + Admin API + 内置 Dashboard）
# 变更记录:
#   2026-08-03 ① 新增 etcd 容器，APISIX 切回 traditional 模式（Admin API/Dashboard 可用）
#              ② APISIX 新增端口: 9180(Admin API + Dashboard UI) / 7085(Status API)
#              ③ 全部凭据参数化（gateway/.env），不再硬编码
#              ④ 卷路径相对化；Swagger API_URL 参数化；Syncer Admin URL 修正为 9180
#   配套文档: docs/审查文档/20-*、21-*
# =============================================================================

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pgsql_data:
    driver: local
  casdoor_data:
    driver: local
  etcd_data:
    driver: local

services:
  # ===========================================================================
  # etcd — APISIX 配置中心（traditional 模式必需）
  # 注意: 不映射 2379 到宿主机（Pigsty etcd 已占用 2379），容器间用 app-etcd:2379
  # ===========================================================================
  etcd:
    image: bitnamilegacy/etcd:3.5.11
    container_name: app-etcd
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.8
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"    # ⚠️ 仅开发环境；生产改用 ETCD_ROOT_PASSWORD
      ETCD_ADVERTISE_CLIENT_URLS: "http://app-etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    volumes:
      - etcd_data:/bitnami/etcd

  # ===========================================================================
  # pgsql — 业务数据库（PostgREST 数据源）
  # 首次启动自动执行 ./postgres/init/*.sql（创建 authenticator/web_anon 角色）
  # ===========================================================================
  pgsql:
    image: postgres:17-alpine
    container_name: pgsql
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.10
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
    ports:
      - "5433:5432"    # 供宿主机执行 dbmate/apply-src（deploy-db.sh 设置 DB_PORT=5433）
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # pgbouncer — 连接池（PostgREST → pgbouncer → pgsql）
  # ===========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.11
    environment:
      - DATABASE_URL=postgres://app_owner:${DB_PASSWORD:-dev_password_change_me}@pgsql:5432/app_db
      - AUTH_USER=authenticator
      - AUTH_PASSWORD=${AUTHENTICATOR_PASSWORD:-authenticator_dev_pass}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=session
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - ADMIN_USERS=app_owner
      - LISTEN_PORT=6432
    depends_on:
      pgsql:
        condition: service_healthy

  # ===========================================================================
  # casdoor-db — Casdoor 专用数据库
  # ===========================================================================
  casdoor-db:
    image: postgres:17-alpine
    container_name: casdoor-db
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.5
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: ${CASDOOR_DB_PASSWORD:-casdoor}
    volumes:
      - casdoor_data:/var/lib/postgresql/data

  # ===========================================================================
  # APISIX API 网关（Traditional 模式: 网关 + Admin API + 内置 Dashboard）
  # ===========================================================================
  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: app-apisix
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.3
    environment:
      APISIX_WORKER_PROCESSES: "1"
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}   # ⚠️ 上线前务必更换
    ports:
      - "9080:9080"    # 数据面 HTTP
      - "9443:9443"    # 数据面 HTTPS
      - "9180:9180"    # Admin API + 内置 Dashboard（浏览器访问 http://localhost:9180/ui）
      - "7085:7085"    # Status API（健康检查）
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd

  # ===========================================================================
  # PostgREST API 引擎
  # ===========================================================================
  postgrest:
    image: postgrest/postgrest:v14.15
    container_name: app-postgrest
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.2
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator_dev_pass}@pgbouncer:6432/app_db?sslmode=disable"
      PGRST_DB_SCHEMAS: "api_v1_sys,api_v1_sales,api_v1_inventory"
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_EXTRA_SEARCH_PATH: "api_v1_sys,api_v1_sales,api_v1_inventory,public,sales,inventory"
      PGRST_JWT_SECRET: '${JWKS_JSON}'
      PGRST_DB_PRE_REQUEST: "api_v1_sys.check_token_blacklist"
      PGRST_OPENAPI_SERVER_PROXY_URI: "http://localhost:3001"
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_CORS_ORIGINS: "*"           # Swagger 浏览器端直连拉取 spec，必须开启
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_MAX_ROWS: "1000"
      PGRST_PRE_ERROR_EXTENDED: "true"
      PGRST_DB_TX_END: "commit"
    ports:
      - "3001:3000"
    depends_on:
      - pgbouncer

  # ===========================================================================
  # Swagger UI
  # ===========================================================================
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.2.0
    container_name: app-swagger
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.4
    environment:
      # 浏览器端拉取 spec: 与 Docker 同机时 localhost 即宿主机映射端口（IP 漂移免疫）
      API_URL: "http://localhost:${PGRST_PORT:-3001}/"
    ports:
      - "8082:8080"

  # ===========================================================================
  # Casdoor IAM/OAuth 服务
  # ===========================================================================
  casdoor:
    image: casbin/casdoor:v1.680.0
    container_name: app-casdoor
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.6
    ports:
      - "8000:8000"
    environment:
      driverName: postgres
      dataSourceName: "user=casdoor password=${CASDOOR_DB_PASSWORD:-casdoor} host=casdoor-db port=5432 sslmode=disable dbname=casdoor"
      runMode: dev
      httpPort: 8000
    volumes:
      - casdoor_data:/app/conf
    depends_on:
      - casdoor-db

  # ===========================================================================
  # Policy Syncer（traditional 模式下 Admin API 可用，直接推送 Casbin 策略）
  # ===========================================================================
  syncer:
    build:
      context: ../db/syncer
      dockerfile: Dockerfile
    container_name: policy-syncer
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.7
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_USER: app_owner
      DB_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      SSL_MODE: disable
      APISIX_ADMIN_URL: http://apisix:9180/apisix/admin/plugin_metadata/authz-casbin
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
    depends_on:
      - apisix
      - pgbouncer
