# =============================================================================
# OmniPG - Docker Compose Stack（全栈版: 网关 + Admin API + 内置 Dashboard）
# 架构: PostgreSQL/pgBouncer/Redis 由 Pigsty 统一管理（宿主 WSL2），
#       Compose 仅部署网关侧服务（etcd/APISIX/PostgREST/Swagger/Casdoor/Syncer）
# 变更记录:
#   2026-08-03 ① 新增 etcd 容器，APISIX 切回 traditional 模式（Admin API/Dashboard 可用）
#              ② APISIX 新增端口: 9180(Admin API + Dashboard UI) / 7085(Status API)
#              ③ 全部凭据参数化（gateway/.env），不再硬编码
#              ④ 卷路径相对化；Swagger API_URL 参数化；Syncer Admin URL 修正为 9180
#              ⑤ 【移除 docker PG】删除 pgsql/pgbouncer/casdoor-db 容器，
#                 连接串改指宿主 Pigsty PG（host.docker.internal:6432/5432）
#                 详见 docs/审查文档/22-*
#   配套文档: docs/审查文档/20-*、21-*、22-*
# =============================================================================

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  etcd_data:
    driver: local

services:
  # ===========================================================================
  # etcd — APISIX 配置中心（traditional 模式必需）
  # 注意: 不映射 2379 到宿主机（Pigsty etcd 已占用 2379），容器间用 app-etcd:2379
  # ===========================================================================
  etcd:
    image: bitnamilegacy/etcd:3.5.11
    container_name: app-etcd
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.8
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"    # ⚠️ 仅开发环境；生产改用 ETCD_ROOT_PASSWORD
      ETCD_ADVERTISE_CLIENT_URLS: "http://app-etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    volumes:
      - etcd_data:/bitnami/etcd

  # ===========================================================================
  # APISIX API 网关（Traditional 模式: 网关 + Admin API + 内置 Dashboard）
  # ===========================================================================
  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: app-apisix
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.3
    environment:
      APISIX_WORKER_PROCESSES: "1"
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}   # ⚠️ 上线前务必更换
    ports:
      - "9080:9080"    # 数据面 HTTP
      - "9443:9443"    # 数据面 HTTPS
      - "9180:9180"    # Admin API + 内置 Dashboard（浏览器访问 http://localhost:9180/ui）
      - "7085:7085"    # Status API（健康检查）
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd

  # ===========================================================================
  # PostgREST API 引擎（数据源: 宿主 Pigsty pgBouncer，经 host.docker.internal）
  # ===========================================================================
  postgrest:
    image: postgrest/postgrest:v14.15
    container_name: app-postgrest
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.2
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator_dev_pass}@host.docker.internal:6432/app_db?sslmode=disable"
      PGRST_DB_SCHEMAS: "api_v1_sys,api_v1_sales,api_v1_inventory"
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_EXTRA_SEARCH_PATH: "api_v1_sys,api_v1_sales,api_v1_inventory,public,sales,inventory"
      # Phase 1: Casdoor JWKS（公钥 JSON）作为 JWT 验签密钥；容器内同时暴露 JWKS_JSON 供 conf 引用
      JWKS_JSON: '${JWKS_JSON}'
      PGRST_JWT_SECRET: '${JWKS_JSON}'
      # Phase 1 D10: Casdoor JWT roles 为角色对象数组（[{name:...}]），取首个角色名（JSPath 语法，. 开头）
      PGRST_JWT_ROLE_CLAIM_KEY: ".roles[0].name"
      PGRST_DB_PRE_REQUEST: "api_v1_sys.check_token_blacklist"
      PGRST_OPENAPI_SERVER_PROXY_URI: "http://localhost:3001"
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_CORS_ORIGINS: "*"           # Swagger 浏览器端直连拉取 spec，必须开启
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_MAX_ROWS: "1000"
      PGRST_PRE_ERROR_EXTENDED: "true"
      PGRST_DB_TX_END: "commit"
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================================================
  # Swagger UI
  # ===========================================================================
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.2.0
    container_name: app-swagger
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.4
    environment:
      # 浏览器端拉取 spec: 与 Docker 同机时 localhost 即宿主机映射端口（IP 漂移免疫）
      API_URL: "http://localhost:${PGRST_PORT:-3001}/"
    ports:
      - "8082:8080"

  # ===========================================================================
  # Casdoor IAM/OAuth 服务（数据源: 宿主 Pigsty PG 的 casdoor 库）
  # ===========================================================================
  casdoor:
    image: casbin/casdoor:3.133.0
    container_name: app-casdoor
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 172.20.0.6
    ports:
      - "8000:8000"
    environment:
      driverName: postgres
      dataSourceName: "user=casdoor password=${CASDOOR_DB_PASSWORD:-casdoor_dev_pass} host=host.docker.internal port=6432 sslmode=disable dbname=casdoor"
      runMode: dev
      httpPort: 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================================================
  # Policy Syncer（已迁移至 WSL2 本地 systemd 服务，不再通过 Docker 运行）
  # 详见: db/casbin-syncer/ + scripts/casbin-syncer.service
  # ===========================================================================
