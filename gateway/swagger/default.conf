  types {
    text/plain yaml;
    text/plain yml;
  }

  gzip on;
  gzip_static on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_types text/plain text/css application/javascript;

  map $request_method $access_control_max_age {
    OPTIONS 1728000; # 20 days
  }
  server_tokens off; # Hide Nginx version

  server {
    listen            8080;
    server_name       localhost;
    index             index.html index.htm;

    # ---------------------------------------------------------------------------
    # PostgREST 按模块 OpenAPI spec（2026-09-05 多模块切换）
    # /pgrst-spec/<module> → PostgREST /，注入 Accept-Profile: <module>。
    # Swagger UI 无法为 spec 拉取携带自定义头（fragment 会被改写成 query、
    # query 会被 PostgREST 当过滤器），故由网关侧注入。
    # ---------------------------------------------------------------------------
    location ~ ^/pgrst-spec/([\w.]+)$ {
      set $pgrst_profile $1;
      rewrite ^/pgrst-spec/[\w.]+$ / break;
      proxy_pass http://app-postgrest:3000;
      proxy_set_header Accept-Profile $pgrst_profile;
      proxy_set_header Host $host;
    }

    location / {
      absolute_redirect off;
      alias            /usr/share/nginx/html/;
      expires 1d;

      location ~ swagger-initializer.js {
        expires -1;
        include templates/cors.conf;
      }

      location ~* \.(?:json|yml|yaml)$ {
        #SWAGGER_ROOT
        expires -1;

        include templates/cors.conf;
      }

      include templates/cors.conf;
    }
  }
