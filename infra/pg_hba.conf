# PostgreSQL Client Authentication Configuration File
# ===================================================
# S-G3 收窄（2026-11-20）：外部网段按实测连接普查（census）改「角色白名单」，
# 原先的 all/all 使任意容器/主机可尝试任意角色（含 postgres 超管）。
# 实测外部来源 = Windows host 经 netsh portproxy 转发（源 172.17.112.1，落在
# 172.17.0.0/16）：
#   * logto_tenant_app_db_default / _admin —— Logto 租户库隔离角色（实测 default
#     角色承载 app_db 连接；短生命周期，census 快照易漏——2026-11-20 e2e 12/34
#     事故即漏此角色所致）
#   * logto        —— Logto 容器直连 DSN 用户（DB_URL 声明，当前未实测出现）
#   * authenticator —— PostgREST（经 Windows:6432 → 本机 pgbouncer）
#   * app_owner    —— 另一项目 Windows 后端连接池（21 conn / SELECT 1 保活）
#   * mcp_admin    —— Windows 侧 MCP 工具（低频，未入 census 但属本架构工作流）
# postgres / dbuser_monitor 等其余角色一律仅限本地回环 / Unix socket。
# 已移除：127.0.0.1 与 ::1 的 md5 死规则（scram 规则在前恒胜出，属弱认证隐患）。
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Database administrative login by Unix domain socket (DO NOT DISABLE!)
local   all             postgres                                peer

# "local" is for Unix domain socket connections only
local   all             all                                     peer

# IPv4 local connections (scram-sha-256)
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections (scram-sha-256)
host    all             all             ::1/128                 scram-sha-256

# Allow replication connections from localhost
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# Windows→WSL portproxy / Docker default bridge（census 实测承载 Windows 转发流量）
host    all             logto                           172.17.0.0/16   scram-sha-256
host    all             logto_tenant_app_db_default     172.17.0.0/16   scram-sha-256
host    all             logto_tenant_app_db_admin       172.17.0.0/16   scram-sha-256
host    all             authenticator                   172.17.0.0/16   scram-sha-256
host    all             app_owner                       172.17.0.0/16   scram-sha-256
host    all             mcp_admin                       172.17.0.0/16   scram-sha-256

# Docker custom app-net（当前架构下容器经 Windows portproxy，源恒为 172.17.x；
# 白名单保留以防未来容器直连拓扑）
host    all             logto                           172.20.0.0/16   scram-sha-256
host    all             logto_tenant_app_db_default     172.20.0.0/16   scram-sha-256
host    all             logto_tenant_app_db_admin       172.20.0.0/16   scram-sha-256
host    all             authenticator                   172.20.0.0/16   scram-sha-256
host    all             app_owner                       172.20.0.0/16   scram-sha-256
host    all             mcp_admin                       172.20.0.0/16   scram-sha-256

# Docker Desktop host.docker.internal 网段（同白名单）
host    all             logto                           192.168.65.0/24 scram-sha-256
host    all             logto_tenant_app_db_default     192.168.65.0/24 scram-sha-256
host    all             logto_tenant_app_db_admin       192.168.65.0/24 scram-sha-256
host    all             authenticator                   192.168.65.0/24 scram-sha-256
host    all             app_owner                       192.168.65.0/24 scram-sha-256
host    all             mcp_admin                       192.168.65.0/24 scram-sha-256
