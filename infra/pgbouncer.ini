[databases]
app_db = host=127.0.0.1 port=5432 dbname=app_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
# 阶段 4 事务池（2026-11-20，实验转正）：
#   * pool_mode=transaction + max_prepared_statements（pgbouncer ≥1.21 协议级跟踪，
#     与 PostgREST v12+ 默认启用的 prepared statements 兼容）
#   * 基线→收益（C=50 直连）：204→318 QPS（+56%），p99 1016→481ms（减半）
#   * PostgREST 配套（gateway/docker-compose.yml）：PGRST_DB_POOL=20（10→20）、
#     PGRST_DB_CHANNEL=""（LISTEN 属会话级特性，事务池下不可靠）
#   * JWT/RLS 语义兼容前提：PostgREST 每请求 BEGIN + SET LOCAL claims/ROLE
#     + COMMIT（PGRST_DB_TX_END=commit），事务池安全
pool_mode = transaction
max_prepared_statements = 200
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
client_login_timeout = 60
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
admin_users = app_owner
stats_users = app_owner
