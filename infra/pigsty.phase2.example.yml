# =============================================================================
# OmniPG Phase 2b 多机部署示例（草案，2026-08-20；**未启用**，仅供规划参考，不作为部署依据）
#   - 以 infra/pigsty.yml 为基准派生，差异仅：各组 hosts 换成真实 IP、redis 归属网关机
#   - 角色划分（占位 IP，落地时替换为实际内网 IP）：
#       DB 机   10.0.0.10 : pg_omnipg / infra / etcd / vibe（兼管理节点，admin_ip）
#       网关机  10.0.0.20 : redis / docker（compose 应用容器在其上运行，Redis 随网关机 2026-08-20 决策）
#       前端机  10.0.0.30 : 不进 Pigsty（Nginx 静态站，见 wiki/03-部署指南/多节点与CICD演进.md §5.2/§6.4）
#   - 部署方式（管理节点集中执行，单文件 + 官方剧本 + -l 主机限制）：
#       ./pgsql.yml -l 10.0.0.10 && ./infra.yml -l 10.0.0.10 && ./etcd.yml -l 10.0.0.10
#       ./node.yml -l 10.0.0.20 && ./docker.yml -l 10.0.0.20 && ./redis.yml -l 10.0.0.20
#   - 密码占位符（${DB_PASSWORD} 等）由 scripts/render-config.sh + CI GitHub Secrets 注入
#   - 启用步骤：替换占位 IP → 校验 pg_hba 网段（按最小权限收窄，见 §7 决策 3）→
#       node_firewall_public_port 按角色收敛（组级 vars，见 §5.4）→ 管理节点复制本文件为
#       ~/pigsty/pigsty.yml → 按角色跑剧本 → 网关容器 DB_HOST 改 DB 机内网 IP
#   权威说明：wiki/03-部署指南/多节点与CICD演进.md
# =============================================================================
all:

  children:

    pg_omnipg:
      hosts:
        10.0.0.10: { pg_seq: 1, pg_role: primary }
      vars:
        pg_cluster: pg_omnipg
        pg_extensions:
          - pgcrypto
          - pg_net
          - pgtap
          - pg_graphql
          - pg_cron
          # ---- 2026-08-05 新增（24-扩展引入分析 决策）----
          - safeupdate            # P0 防误删（需 shared_preload，装包后需 edit-config 加 preload + 重启）
          - plpgsql_check         # P0 静态检查
          - pg_jsonschema         # P0 update_config 校验
          - omni_csv              # P0 export/import_csv 重写
          - pgmemento             # P1 审计时间旅行（试点）
          - pg_mockable           # P1 pgtap 配套单测
          - jsquery               # P1 JSONB 查询语言
          - index_advisor         # P1 索引建议工具
          - pg_repack             # P1 膨胀治理
        pg_users:
          - name: app_owner
            password: ${DB_PASSWORD}
            pgbouncer: true
            privileges: CREATEDB
            comment: 'app owner'
          - name: authenticator
            password: ${AUTHENTICATOR_PASSWORD}
            pgbouncer: true
            comment: 'PostgREST auth role'
          - name: web_anon
            comment: 'PostgREST anonymous role (NOLOGIN)'
          - name: logto
            password: ${LOGTO_DB_PASSWORD}
            comment: 'Logto OIDC service account（与业务库同机同集群，2026-08-20 决策）'
        pg_databases:
          - name: app_db
            owner: app_owner
            comment: 'OmniPG main database'
            extensions:
              - { name: pgcrypto }
              - { name: pg_net }
              - { name: pgtap }
              - { name: pg_graphql }
              - { name: pg_cron }
              # ---- 2026-08-05 新增（24-扩展引入分析 决策）----
              - { name: plpgsql_check }
              - { name: pg_jsonschema }
              - { name: omni_csv }
              - { name: pgmemento }
              - { name: pg_mockable }
              - { name: jsquery }
              - { name: index_advisor }
              - { name: pg_repack }
              # 注: safeupdate 无需 CREATE EXTENSION（Load=是 Create=否），仅装包 + preload
          - name: logto
            owner: logto
            comment: 'Logto OIDC 数据库（与业务库同机同集群，2026-08-20 决策；直连 5433，不经 pgbouncer）'
        pg_hba_builtin: []  # 禁用内置规则，使用自定义规则
        pg_hba_rules:
          - type: host
            database: all
            user: all
            address: 127.0.0.1/32
            method: scram-sha-256
            comment: 'local IPv4'
          - type: host
            database: all
            user: all
            address: ::1/128
            method: scram-sha-256
            comment: 'local IPv6'
          - type: host
            database: all
            user: all
            address: 172.17.0.0/16
            method: scram-sha-256
            comment: 'Docker bridge'
          - type: host
            database: all
            user: all
            address: 172.20.0.0/16
            method: scram-sha-256
            comment: 'Docker app-net'
          - type: host
            database: all
            user: all
            address: 10.0.0.0/8
            method: scram-sha-256
            comment: '内网 (Phase 2 过渡网段，落地时按最小权限收窄为具体网段/主机，2026-08-20 决策)'

    infra:
      hosts:
        10.0.0.10: { infra_seq: 1 }
      vars:
        repo_enabled: false
        nginx_enabled: true
        grafana_enabled: true
        victoriametrics_enabled: true
        victorialogs_enabled: true
        victoriatraces_enabled: true
        dnsmasq_enabled: true
        chrony_enabled: true

    etcd:
      hosts:
        10.0.0.10: { etcd_seq: 1 }
      vars:
        etcd_cluster: etcd
        etcd_safeguard: false

    # Redis：Pigsty REDIS 模块统一管理（standalone 原生部署，不进 Docker，2026-08-20 决策）
    # 多机时默认随网关机（与 deploy-infra.sh gateway 模式一致），Phase 2 定稿实际主机时确认
    redis:
      hosts:
        10.0.0.20: { redis_node: 1, redis_instances: { 6379: {} } }
      vars:
        redis_cluster: redis
        redis_mode: standalone
        redis_exporter_enabled: true

    docker:
      hosts:
        10.0.0.20: { docker_seq: 1 }

    vibe:
      hosts:
        10.0.0.10: { vibe_seq: 1 }
      vars:
        vibe_enabled: true
        vibe_packages:
          - claude
          - nodejs
        vibe_features:
          claude_code: true

  vars:

    version: v4.4.0
    admin_ip: 10.0.0.10
    region: china
    proxy_env:
      no_proxy: "localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,*.pigsty,*.aliyun.com,mirrors.*,*.myqcloud.com,*.tsinghua.edu.cn"

    infra_portal:
      home         : { domain: i.pigsty }
      grafana      : { domain: g.pigsty, endpoint: "${admin_ip}:3000", websocket: true }
      vmetrics     : { domain: p.pigsty, endpoint: "${admin_ip}:8428" }
      pgadmin      : { domain: adm.pigsty, endpoint: "${admin_ip}:8885" }
      code         : { domain: code.pigsty, endpoint: "${admin_ip}:8080" }
      jupyter      : { domain: jupyter.pigsty, endpoint: "${admin_ip}:8889" }

    nodename_overwrite: false
    node_tune: oltp
    node_etc_hosts: ['${admin_ip} i.pigsty sss.pigsty']
    node_repo_modules: 'node,infra,pgsql'
    node_repo_remove: true
    # Phase 1 单机全栈 + Phase 2 分离（db: 6432/8428/2379；gw: 9080/9180/8082/6379）端口并集
    # 2026-08-20 端口收敛：9080 为唯一对外端口；9180 仅内网管理（按内网来源放行）；9443 已从列表移除（预留，不映射）
    # 2026-08-20 决策：单机阶段保留并集；分机后按角色组 vars 收敛（见 wiki/03-部署指南/多节点与CICD演进.md §5.4）
    node_firewall_public_port: [22, 80, 443, 5432, 6432, 3000, 8428, 2379, 9080, 9180, 8000, 8082, 6379]

    pg_version: 18
    pg_locale: C.UTF-8
    pg_lc_collate: C.UTF-8
    pg_lc_ctype: C.UTF-8
    pg_conf: oltp.yml
    pg_safeguard: false
    pg_packages: [ pgsql-main, pgsql-common ]

    grafana_admin_password: pigsty
    grafana_view_password: DBUser.Viewer
    pg_admin_password: DBUser.DBA
    pg_monitor_password: DBUser.Monitor
    pg_replication_password: DBUser.Replicator
    patroni_password: Patroni.API
    haproxy_admin_password: pigsty
    etcd_root_password: Etcd.Root
