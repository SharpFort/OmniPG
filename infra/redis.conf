# S-G1（2026-11-20）：仅回环监听（实测部署态即 127.0.0.1；requirepass 属凭据项押后，
# 若需跨机访问改为内网网段并同步启用 requirepass）
bind 127.0.0.1
port 6379
daemonize no
supervised systemd
dir /var/lib/redis
logfile /var/log/redis/redis-server.log
pidfile /run/redis/redis-server.pid
appendonly yes
appendfsync everysec
maxmemory 256mb
maxmemory-policy allkeys-lru
